# Example public-only static host. Configure a real domain and HTTPS using your host's TLS setup.
# Do not point this root at /workspace/seven, frontend/, frontend/dist/, or a backend directory.
server {
    listen 80;
    server_name public.example.com;
    root /srv/ai-influencer-public;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location ~ /\. { deny all; }
    location = /api { return 404; }
    location /api/ { return 404; }
    location = /dashboard { return 404; }
    location /dashboard/ { return 404; }
    location = /accounts { return 404; }
    location /accounts/ { return 404; }
    # Deliberately no SPA fallback or reverse proxy to the private application.
    location / { try_files $uri $uri/ =404; }
}
